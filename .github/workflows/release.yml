name: Release

# Obsidian requires the git tag to match manifest.json `version` EXACTLY, with no
# leading "v". Tag as `1.0.0`, not `v1.0.0` — a mismatch makes the plugin
# uninstallable from within Obsidian.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag $TAG does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Verify versions.json covers this release
        run: |
          TAG="${GITHUB_REF_NAME}"
          node -e "
            const versions = require('./versions.json');
            const manifest = require('./manifest.json');
            const tag = process.env.GITHUB_REF_NAME;
            if (!versions[tag]) {
              console.error('::error::versions.json has no entry for ' + tag);
              process.exit(1);
            }
            if (versions[tag] !== manifest.minAppVersion) {
              console.error('::error::versions.json[' + tag + ']=' + versions[tag] +
                ' does not match manifest.minAppVersion=' + manifest.minAppVersion);
              process.exit(1);
            }
          "

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f main.js || { echo "::error::build did not emit main.js"; exit 1; }

      # main.js and manifest.json must be attached as INDIVIDUAL binary assets.
      # The auto-generated source zip does not satisfy the community directory.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json
